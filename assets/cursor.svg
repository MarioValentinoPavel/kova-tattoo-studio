<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="32" height="32" viewBox="0 0 32 32">
  <!-- Máquina de tatuar tipo pen, en diagonal; la punta de la aguja es el punto activo (5,27) -->
  <defs>
    <g id="m">
      <path d="M16 1.5 C 16 -0.5, 17 -1.2, 18.6 -1.4" fill="none"/>
      <rect x="12.5" y="1.5" width="7" height="8.5" rx="2"/>
      <rect x="13" y="10" width="6" height="11" rx="1.2"/>
      <path d="M13.6 21 L18.4 21 L17 27 L15 27 Z"/>
      <line x1="16" y1="27" x2="16" y2="30.6"/>
    </g>
  </defs>
  <g transform="rotate(45 16 16)" stroke-linejoin="round" stroke-linecap="round">
    <!-- halo claro para que se vea sobre fondo oscuro -->
    <use xlink:href="#m" href="#m" fill="#f1ece2" stroke="#f1ece2" stroke-width="3.2"/>
    <use xlink:href="#m" href="#m" fill="none" stroke="#0f1410" stroke-width="1.3"/>
    <!-- colores -->
    <rect x="12.5" y="1.5" width="7" height="8.5" rx="2" fill="#f1ece2" stroke="#0f1410" stroke-width="1"/>
    <rect x="13" y="10" width="6" height="11" rx="1.2" fill="#8ea58c" stroke="#0f1410" stroke-width="1"/>
    <path d="M13.6 21 L18.4 21 L17 27 L15 27 Z" fill="#f1ece2" stroke="#0f1410" stroke-width="1"/>
    <g stroke="#0f1410" stroke-width=".7">
      <line x1="12.5" y1="5.5" x2="19.5" y2="5.5"/>
      <line x1="13" y1="13" x2="19" y2="13"/>
      <line x1="13" y1="15.5" x2="19" y2="15.5"/>
      <line x1="13" y1="18" x2="19" y2="18"/>
    </g>
  </g>
</svg>
